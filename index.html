
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우리들의 음악 앨범 전시관</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #121212; /* 스트리밍 사이트 느낌의 다크 테마 */
            color: #ffffff;
        }

        .gradient-text {
            background: linear-gradient(to right, #1db954, #1ed760);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .album-card {
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .album-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(29, 185, 84, 0.2);
        }

        .play-button-overlay {
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .album-card:hover .play-button-overlay {
            opacity: 1;
        }

        /* 커스텀 스크롤바 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #121212;
        }
        ::-webkit-scrollbar-thumb {
            background: #333;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #555;
        }

        .modal-open {
            overflow: hidden;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spotify: {
                            base: '#1db954',
                            dark: '#1ed760',
                            black: '#191414',
                            gray: '#b3b3b3'
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="min-h-screen flex flex-col">

<nav class="bg-black/90 backdrop-blur-md sticky top-0 z-50 border-b border-gray-800 p-4">
    <div class="container mx-auto flex justify-between items-center">
        <!-- 1) 제목 변경 -->
        <a href="#" class="text-2xl font-black tracking-tighter flex items-center gap-2" onclick="showMainPage()">
            <i class="fas fa-compact-disc text-spotify-base animate-spin-slow" style="animation-duration: 3s;"></i>
            <span class="gradient-text">ANHWA MUSIC PRODUCING PROJECT</span>
        </a>
        <div class="flex gap-4">
            <span id="firebase-status" class="hidden md:inline-flex items-center gap-2 text-xs text-yellow-300 bg-gray-900 border border-gray-700 px-3 py-2 rounded-full">
                <i class="fas fa-circle-notch fa-spin"></i> 데이터 연결 중
            </span>
        </div>
    </div>
</nav>

<main class="flex-grow container mx-auto p-4 md:p-8">
    
    <!-- 학급 선택 필터 -->
    <div class="mb-8" id="class-filter-section">
        <h2 class="text-xl font-bold mb-4 flex flex-wrap items-center gap-3">
            <span class="flex items-center gap-2">
                <i class="fas fa-layer-group text-spotify-base"></i> 학급별 보기
            </span>
            <button onclick="showRegistrationModal()" class="bg-spotify-base hover:bg-spotify-dark text-black text-sm font-bold py-1.5 px-4 rounded-full transition-colors inline-flex items-center gap-2 whitespace-nowrap">
                <i class="fas fa-plus"></i> 내 앨범 등록
            </button>
        </h2>
        <div class="flex flex-wrap gap-2" id="class-buttons">
            <button class="class-btn active bg-spotify-base text-black font-bold py-1.5 px-4 rounded-full transition-colors" data-class="all">전체</button>
            <button class="class-btn bg-gray-800 hover:bg-gray-700 text-white font-medium py-1.5 px-4 rounded-full transition-colors" data-class="6반">6반</button>
            <button class="class-btn bg-gray-800 hover:bg-gray-700 text-white font-medium py-1.5 px-4 rounded-full transition-colors" data-class="7반">7반</button>
            <button class="class-btn bg-gray-800 hover:bg-gray-700 text-white font-medium py-1.5 px-4 rounded-full transition-colors" data-class="8반">8반</button>
            <button class="class-btn bg-gray-800 hover:bg-gray-700 text-white font-medium py-1.5 px-4 rounded-full transition-colors" data-class="9반">9반</button>
            <button class="class-btn bg-gray-800 hover:bg-gray-700 text-white font-medium py-1.5 px-4 rounded-full transition-colors" data-class="10반">10반</button>
        </div>

        <!-- 앨범 검색 -->
        <div class="mt-5 max-w-2xl">
            <div class="relative">
                <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-gray-500 pointer-events-none"></i>
                <input
                    type="search"
                    id="album-search"
                    placeholder="앨범명, 학생 이름, 수록곡으로 검색"
                    autocomplete="off"
                    class="w-full bg-gray-900 border border-gray-700 rounded-full py-3 pl-11 pr-12 text-white placeholder-gray-500 outline-none focus:border-spotify-base focus:ring-1 focus:ring-spotify-base transition-colors"
                >
                <button
                    type="button"
                    id="search-clear-btn"
                    onclick="clearAlbumSearch()"
                    aria-label="검색어 지우기"
                    class="hidden absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 hover:text-white transition-colors"
                >
                    <i class="fas fa-times-circle"></i>
                </button>
            </div>
            <p id="search-result-count" class="text-xs text-gray-500 mt-2 ml-2"></p>
        </div>
    </div>

    <!-- 앨범 갤러리 -->
    <div id="album-gallery" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
        <!-- 앨범 카드들이 동적으로 추가될 영역 -->
    </div>

    <!-- 앨범 상세 보기 화면 (초기에는 숨김) -->
    <div id="album-detail-view" class="hidden">
        <button onclick="closeAlbumDetail()" class="mb-6 text-spotify-gray hover:text-white transition-colors flex items-center gap-2">
            <i class="fas fa-arrow-left"></i> 목록으로 돌아가기
        </button>
        
        <div class="bg-gray-900 rounded-2xl p-6 md:p-10 flex flex-col md:flex-row gap-8 shadow-2xl">
            <!-- 앨범 아트 및 정보 -->
            <div class="md:w-1/3 flex flex-col items-center md:items-start text-center md:text-left">
                <img id="detail-cover" src="" alt="Album Cover" class="w-64 h-64 md:w-full md:h-auto aspect-square object-cover rounded-lg shadow-xl mb-6">
                <h1 id="detail-title" class="text-3xl md:text-4xl font-black mb-2 text-white">앨범명</h1>
                <p id="detail-artist" class="text-xl text-spotify-base font-medium mb-4">아티스트명</p>
                <!-- 앨범 소개 표시 영역 추가 -->
                <p id="detail-description" class="text-gray-300 text-sm mb-6 leading-relaxed italic border-l-4 border-spotify-base pl-3">앨범 소개</p>
                
                <div class="w-full bg-gray-800 rounded-lg p-4 mb-4">
                    <p class="text-sm text-gray-400 mb-1">제작 정보</p>
                    <p class="text-sm mb-1"><span class="font-bold text-gray-300">작사:</span> <span id="detail-lyricist"></span></p>
                    <p class="text-sm mb-1"><span class="font-bold text-gray-300">작곡:</span> <span id="detail-composer"></span></p>
                    <p class="text-sm"><span class="font-bold text-gray-300">프로듀싱:</span> <span id="detail-producer"></span></p>
                </div>

                <!-- 현재 익명 사용자 본인이 등록한 앨범에만 표시 -->
                <div id="detail-owner-actions" class="hidden w-full gap-2 mb-4">
                    <button id="detail-edit-button" type="button" class="flex-1 bg-spotify-base hover:bg-spotify-dark text-black font-bold py-2.5 px-4 rounded-full transition-colors">
                        <i class="fas fa-pen mr-2"></i>수정
                    </button>
                    <button id="detail-delete-button" type="button" class="flex-1 bg-red-600 hover:bg-red-500 text-white font-bold py-2.5 px-4 rounded-full transition-colors">
                        <i class="fas fa-trash-alt mr-2"></i>삭제
                    </button>
                </div>
            </div>

            <!-- 트랙 리스트 및 설명 -->
            <div class="md:w-2/3 flex flex-col">
                <!-- 실시간 별점 -->
                <div class="bg-black/30 border border-gray-800 rounded-2xl p-5 mb-6">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 mb-4">
                        <div>
                            <h3 class="text-xl font-bold flex items-center gap-2">
                                <i class="fas fa-star text-yellow-400"></i> 앨범 별점
                            </h3>
                            <p id="rating-summary" class="text-sm text-gray-400 mt-1">별점을 불러오는 중...</p>
                        </div>
                        <div id="rating-average-badge" class="self-start sm:self-auto bg-gray-800 border border-gray-700 rounded-full px-4 py-2 text-sm font-bold text-gray-300">
                            아직 평가 없음
                        </div>
                    </div>

                    <div id="rating-stars" class="flex items-center gap-2 mb-3" aria-label="별점 선택">
                        <button type="button" data-rating-score="1" aria-label="1점" class="rating-star text-gray-600 hover:text-yellow-400 hover:scale-110 transition-all text-3xl"><i class="fas fa-star"></i></button>
                        <button type="button" data-rating-score="2" aria-label="2점" class="rating-star text-gray-600 hover:text-yellow-400 hover:scale-110 transition-all text-3xl"><i class="fas fa-star"></i></button>
                        <button type="button" data-rating-score="3" aria-label="3점" class="rating-star text-gray-600 hover:text-yellow-400 hover:scale-110 transition-all text-3xl"><i class="fas fa-star"></i></button>
                        <button type="button" data-rating-score="4" aria-label="4점" class="rating-star text-gray-600 hover:text-yellow-400 hover:scale-110 transition-all text-3xl"><i class="fas fa-star"></i></button>
                        <button type="button" data-rating-score="5" aria-label="5점" class="rating-star text-gray-600 hover:text-yellow-400 hover:scale-110 transition-all text-3xl"><i class="fas fa-star"></i></button>
                    </div>
                    <p id="my-rating-status" class="text-sm text-gray-400">별을 눌러 1~5점으로 평가해주세요.</p>
                    <p class="text-xs text-gray-600 mt-2">익명 로그인 기준 1인 1표입니다. 다시 선택하면 기존 점수가 수정되며 중복 집계되지 않습니다.</p>
                </div>

                <h3 class="text-2xl font-bold mb-6 border-b border-gray-700 pb-2">수록곡</h3>
                <div id="track-list" class="flex flex-col gap-4">
                    <!-- 트랙 정보가 동적으로 추가됨 -->
                </div>
            </div>
        </div>
    </div>
</main>

<div id="registration-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-[100] hidden flex justify-center items-center p-4">
    <div class="bg-gray-900 rounded-2xl w-full max-w-4xl max-h-[90vh] overflow-y-auto shadow-2xl border border-gray-700">
        <div class="sticky top-0 bg-gray-900/95 backdrop-blur-sm p-6 border-b border-gray-800 flex justify-between items-center z-10">
            <h2 id="registration-modal-title" class="text-2xl font-bold">새 앨범 등록하기</h2>
            <button onclick="closeRegistrationModal()" class="text-gray-400 hover:text-white transition-colors">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
        
        <form id="album-form" class="p-6 md:p-8 space-y-8" onsubmit="handleRegistration(event)">
            <!-- 기본 정보 섹션 -->
            <div class="space-y-4">
                <h3 class="text-lg font-semibold text-spotify-base border-b border-gray-700 pb-2">기본 정보</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">소속 반 <span class="text-red-500">*</span></label>
                        <select id="reg-class" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:border-spotify-base focus:ring-1 focus:ring-spotify-base outline-none">
                            <option value="">반 선택</option>
                            <option value="6반">6반</option>
                            <option value="7반">7반</option>
                            <option value="8반">8반</option>
                            <option value="9반">9반</option>
                            <option value="10반">10반</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">아티스트(이름) <span class="text-red-500">*</span></label>
                        <input type="text" id="reg-artist" required placeholder="본인 이름 또는 팀명" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2.5 text-white focus:border-spotify-base focus:ring-1 focus:ring-spotify-base outline-none">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">앨범명 <span class="text-red-500">*</span></label>
                    <input type="text" id="reg-title" required placeholder="멋진 앨범 이름을 지어주세요" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:border-spotify-base focus:ring-1 focus:ring-spotify-base outline-none text-lg">
                </div>

                <!-- 2) 앨범 소개 입력 칸 추가 -->
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1">앨범 소개 <span class="text-red-500">*</span></label>
                    <textarea id="reg-description" required rows="3" placeholder="이 앨범이 어떤 앨범인지, 어떤 메시지를 담고 있는지 간단히 소개해주세요." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-3 text-white focus:border-spotify-base focus:ring-1 focus:ring-spotify-base outline-none resize-none"></textarea>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">앨범 자켓 이미지 <span class="text-red-500">*</span></label>
                    <div class="flex items-center gap-4">
                        <div class="w-24 h-24 bg-gray-800 rounded-lg border-2 border-dashed border-gray-600 flex items-center justify-center overflow-hidden shrink-0" id="cover-preview-container">
                            <i class="fas fa-image text-gray-500 text-2xl" id="cover-placeholder-icon"></i>
                            <img id="cover-preview" src="" alt="Preview" class="w-full h-full object-cover hidden">
                        </div>
                        <div class="flex-grow">
                            <input type="file" id="reg-cover" accept="image/*" required class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white focus:border-spotify-base outline-none cursor-pointer file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-spotify-base file:text-black hover:file:bg-spotify-dark transition-colors">
                            <p id="cover-help-text" class="text-xs text-gray-500 mt-2">직접 그린 그림이나 디자인한 자켓 이미지를 선택해주세요.</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 제작진 정보 섹션 -->
            <div class="space-y-4">
                <h3 class="text-lg font-semibold text-spotify-base border-b border-gray-700 pb-2">제작진 크레딧</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">작사가</label>
                        <input type="text" id="reg-lyricist" placeholder="이름 입력" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white focus:border-spotify-base outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">작곡가</label>
                        <input type="text" id="reg-composer" placeholder="이름 입력" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white focus:border-spotify-base outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-300 mb-1">프로듀싱</label>
                        <input type="text" id="reg-producer" placeholder="이름 입력" class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 text-white focus:border-spotify-base outline-none">
                    </div>
                </div>
            </div>

            <!-- 수록곡 정보 섹션 (동적 곡 추가 가능) -->
            <div class="space-y-4">
                <div class="border-b border-gray-700 pb-2">
                    <h3 class="text-lg font-semibold text-spotify-base">트랙 정보 (Suno AI 링크)</h3>
                </div>
                
                <div id="tracks-container" class="space-y-4">
                    <!-- 트랙 입력 칸들이 동적으로 생성됩니다 -->
                </div>

                <button type="button" onclick="addTrackInput()" class="w-full py-3 bg-gray-800/80 hover:bg-gray-700/80 text-spotify-base border border-dashed border-spotify-base/50 hover:border-spotify-base font-bold rounded-xl transition-all flex items-center justify-center gap-2">
                    <i class="fas fa-plus text-sm"></i> 곡 추가하기
                </button>
            </div>

            <div class="flex justify-end pt-4 border-t border-gray-800">
                <button type="button" onclick="closeRegistrationModal()" class="mr-4 px-6 py-2 rounded-full font-medium text-gray-300 hover:text-white transition-colors">취소</button>
                <button id="album-submit-button" type="submit" class="bg-spotify-base hover:bg-spotify-dark text-black font-bold py-2 px-8 rounded-full transition-transform hover:scale-105 active:scale-95 shadow-lg shadow-spotify-base/20">
                    앨범 등록하기
                </button>
            </div>
        </form>
    </div>
</div>

<div id="alert-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[200] hidden flex justify-center items-center p-4">
    <div class="bg-gray-800 rounded-xl p-6 max-w-sm w-full text-center shadow-2xl border border-gray-700 transform scale-95 transition-transform" id="alert-content">
        <i id="alert-icon" class="fas fa-check-circle text-5xl text-spotify-base mb-4"></i>
        <h3 id="alert-title" class="text-xl font-bold mb-2">알림</h3>
        <p id="alert-message" class="text-gray-300 mb-6">메시지 내용</p>
        <button onclick="closeAlert()" class="bg-spotify-base hover:bg-spotify-dark text-black font-bold py-2 px-6 rounded-full w-full">확인</button>
    </div>
</div>

<script>
    // 앨범 데이터 상태 관리 (초기 샘플 데이터 포함)
    const sampleAlbumsData = [ ]
       

    let albumsData = [...sampleAlbumsData];
    let currentFilter = 'all';
    let currentSearchQuery = '';
    let trackCount = 0;
    let currentUserId = null;
    let currentDetailAlbumId = null;
    let editingAlbumId = null;
    let editingOriginalCoverUrl = '';
    let ratingUnsubscribe = null;
    let currentRatings = [];
    let ratingSubmitting = false;

    // DOM 로드 완료 후 실행
    document.addEventListener('DOMContentLoaded', () => {
        renderGallery();
        setupFilters();
        setupSearch();
        setupImagePreview();
        initTrackInputs();
        setupRatingButtons();
        initFirebaseSync();
    });

    function updateFirebaseStatus(state, message) {
        const status = document.getElementById('firebase-status');
        if (!status) return;

        const styles = {
            connecting: ['text-yellow-300', 'fa-circle-notch', true],
            connected: ['text-green-400', 'fa-circle-check', false],
            error: ['text-red-400', 'fa-triangle-exclamation', false]
        };
        const [colorClass, iconClass, spin] = styles[state] || styles.connecting;
        status.className = `hidden md:inline-flex items-center gap-2 text-xs ${colorClass} bg-gray-900 border border-gray-700 px-3 py-2 rounded-full`;
        status.innerHTML = `<i class="fas ${iconClass} ${spin ? 'fa-spin' : ''}"></i> ${message}`;
    }

    async function initFirebaseSync() {
        updateFirebaseStatus('connecting', '데이터 연결 중');

        try {
            const service = await window.firebaseAlbumServicePromise;
            currentUserId = service.currentUserId;
            service.listenAlbums(
                (remoteAlbums) => {
                    albumsData = [...remoteAlbums, ...sampleAlbumsData];
                    renderGallery();
                    updateFirebaseStatus('connected', '실시간 연결됨');
                },
                (error) => {
                    console.error('Firestore 실시간 불러오기 실패:', error);
                    updateFirebaseStatus('error', '데이터 연결 실패');
                }
            );
        } catch (error) {
            console.error('Firebase 연결 실패:', error);
            updateFirebaseStatus('error', '데이터 연결 실패');
            showAlert(
                '데이터 연결 실패',
                '공동 앨범 데이터를 불러오지 못했습니다.<br>잠시 후 새로고침해주세요.',
                'error'
            );
        }
    }

    function addTrackInput(title = '', link = '', desc = '') {
        trackCount++;
        const container = document.getElementById('tracks-container');
        const trackDiv = document.createElement('div');
        trackDiv.className = 'track-input-item bg-gray-800/50 p-4 rounded-lg border border-gray-700 relative';
        trackDiv.id = `track-item-${trackCount}`;

        const isFirst = container.children.length === 0;
        const requiredAttr = isFirst ? 'required' : '';
        const requiredStar = isFirst ? '<span class="text-red-500 text-sm font-normal">*</span>' : '';
        const removeBtn = !isFirst ? `
            <button type="button" onclick="removeTrackInput(${trackCount})" class="text-gray-400 hover:text-red-400 text-xs transition-colors flex items-center gap-1">
                <i class="fas fa-trash-alt"></i> 삭제
            </button>
        ` : '';

        trackDiv.innerHTML = `
            <div class="flex justify-between items-center mb-3">

                    }
                    // 브라우저 메모리에 임시 URL을 생성하여 미리보기 제공
                    const objectUrl = URL.createObjectURL(file);
                    preview.src = objectUrl;
                    preview.classList.remove('hidden');
                    icon.classList.add('hidden');

                    preview.classList.add('hidden');
                    icon.classList.remove('hidden');

                }
            });

    function escapeHtml(value) {
        return String(value ?? '')
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
    }

    function safeExternalUrl(value) {
        try {
            const url = new URL(String(value));
            return ['https:', 'http:'].includes(url.protocol) ? url.href : '#';
        } catch {
            return '#';
        }
    }

    function safeImageUrl(value) {
        const url = String(value || '');
        if (/^data:image\/(jpeg|jpg|png|webp);base64,/i.test(url)) return url;
        return safeExternalUrl(url);
    }

    // 다른 기기에서도 표지가 보이도록 이미지를 작게 압축해 Firestore에 저장한다.
    function compressCoverImage(file) {
        return new Promise((resolve, reject) => {
            const reader = new FileReader();

            reader.onerror = () => reject(new Error('이미지 파일을 읽을 수 없습니다.'));
            reader.onload = () => {
                const image = new Image();
                image.onerror = () => reject(new Error('지원하지 않는 이미지 형식입니다.'));
                image.onload = () => {
                    const sourceSize = Math.min(image.width, image.height);
                    const sourceX = (image.width - sourceSize) / 2;
                    const sourceY = (image.height - sourceSize) / 2;
                    let outputSize = 600;
                    let quality = 0.78;

                    const makeDataUrl = () => {
                        const canvas = document.createElement('canvas');
                        canvas.width = outputSize;
                        canvas.height = outputSize;
                        const context = canvas.getContext('2d');
                        context.fillStyle = '#191414';
                        context.fillRect(0, 0, outputSize, outputSize);
                        context.drawImage(
                            image,
                            sourceX,
                            sourceY,
                            sourceSize,
                            sourceSize,
                            0,
                            0,
                            outputSize,
                            outputSize
                        );
                        return canvas.toDataURL('image/jpeg', quality);
                    };

                    let dataUrl = makeDataUrl();
                    if (dataUrl.length > 700000) {
                        outputSize = 420;
                        quality = 0.65;
                        dataUrl = makeDataUrl();
                    }

                    if (dataUrl.length > 850000) {
                        reject(new Error('이미지 용량이 너무 큽니다. 다른 이미지를 선택해주세요.'));
                        return;
                    }
                    resolve(dataUrl);
                };
                image.src = reader.result;
            };
            reader.readAsDataURL(file);
        });
    }

    function renderGallery() {
        const gallery = document.getElementById('album-gallery');
        const resultCount = document.getElementById('search-result-count');
        gallery.innerHTML = '';

        const query = currentSearchQuery.trim().toLowerCase();

        const filteredAlbums = albumsData.filter((album) => {
            const matchesClass = currentFilter === 'all' || album.classNum === currentFilter;
            if (!matchesClass) return false;
            if (!query) return true;

            // 앨범명, 학생/팀 이름, 반, 앨범 소개, 제작진, 수록곡 제목/설명을 한 번에 검색한다.
            const credits = album.credits || {};
            const tracks = Array.isArray(album.tracks) ? album.tracks : [];
            const searchableText = [
                album.title,
                album.artist,
                album.classNum,
                album.description,
                credits.lyricist,
                credits.composer,
                credits.producer,
                ...tracks.flatMap(track => [track?.title, track?.desc])
            ]
                .filter(Boolean)
                .join(' ')
                .toLowerCase();

            return searchableText.includes(query);
        });

        if (resultCount) {
            if (query) {
                resultCount.textContent = `검색 결과 ${filteredAlbums.length}개`;
            } else if (currentFilter !== 'all') {
                resultCount.textContent = `${currentFilter} 앨범 ${filteredAlbums.length}개`;
            } else {
                resultCount.textContent = '';
            }
        }

        if (filteredAlbums.length === 0) {
            const hasSearch = Boolean(query);
            gallery.innerHTML = `
                <div class="col-span-full text-center py-20 text-gray-500">
                    <i class="fas ${hasSearch ? 'fa-search' : 'fa-inbox'} text-4xl mb-4"></i>
                    <p>${hasSearch
                        ? '검색 결과가 없습니다.<br>다른 검색어를 입력해보세요.'
                        : '아직 등록된 앨범이 없습니다.<br>첫 번째 앨범을 등록해보세요!'
                    }</p>
                </div>`;
            return;
        }

        filteredAlbums.forEach(album => {
            const card = document.createElement('div');
            card.className = 'album-card bg-gray-900 rounded-xl p-4 cursor-pointer group relative';
            card.onclick = () => showAlbumDetail(album.id);
            const coverUrl = safeImageUrl(album.coverUrl) || 'https://placehold.co/600x600/1db954/ffffff?text=No+Cover';
            
            // 이미지 에러 처리 추가
            card.innerHTML = `
                <div class="relative mb-4 rounded-md overflow-hidden aspect-square shadow-lg">
                    <img src="${escapeHtml(coverUrl)}" alt="${escapeHtml(album.title)}" class="w-full h-full object-cover" onerror="this.src='https://placehold.co/600x600/1db954/ffffff?text=No+Cover'">
                    <div class="play-button-overlay absolute inset-0 bg-black/40 flex items-center justify-center">
                        <button class="w-12 h-12 rounded-full bg-spotify-base text-black flex items-center justify-center transform translate-y-4 group-hover:translate-y-0 transition-all duration-300 shadow-xl hover:scale-105 hover:bg-spotify-dark">
                            <i class="fas fa-play text-xl ml-1"></i>
                        </button>
                    </div>
                </div>
                <h3 class="font-bold text-white text-lg truncate mb-1">${escapeHtml(album.title)}</h3>
                <p class="text-spotify-gray text-sm truncate mb-2">${escapeHtml(album.artist)}</p>
                <span class="inline-block bg-gray-800 text-xs text-gray-400 px-2 py-1 rounded-md border border-gray-700">${escapeHtml(album.classNum)}</span>

    function renderRatingPanel(ratings = currentRatings) {
        const summary = document.getElementById('rating-summary');
        const badge = document.getElementById('rating-average-badge');
        const myStatus = document.getElementById('my-rating-status');
        const buttons = document.querySelectorAll('[data-rating-score]');

        if (!summary || !badge || !myStatus) return;

        const validRatings = (Array.isArray(ratings) ? ratings : []).filter(rating => {
            const score = Number(rating.score);
            return Number.isInteger(score) && score >= 1 && score <= 5;
        });

        const count = validRatings.length;
        const average = count
            ? validRatings.reduce((sum, rating) => sum + Number(rating.score), 0) / count
            : 0;

        const myRating = validRatings.find(rating =>
            rating.userId === currentUserId || rating.id === currentUserId
        );
        const myScore = myRating ? Number(myRating.score) : 0;

        if (count > 0) {
            summary.textContent = `현재 ${count}명이 평가했습니다.`;
            badge.innerHTML = `<i class="fas fa-star text-yellow-400 mr-1"></i>${average.toFixed(1)} / 5 · ${count}명`;
            badge.classList.remove('text-gray-300');
            badge.classList.add('text-white');
        } else {
            summary.textContent = '아직 등록된 별점이 없습니다.';
            badge.textContent = '아직 평가 없음';
            badge.classList.add('text-gray-300');
            badge.classList.remove('text-white');
        }

        buttons.forEach(button => {
            const score = Number(button.dataset.ratingScore);
            button.classList.toggle('text-yellow-400', score <= myScore);
            button.classList.toggle('text-gray-600', score > myScore);
            button.setAttribute('aria-pressed', score === myScore ? 'true' : 'false');
        });

        myStatus.textContent = myScore
            ? `내 별점: ${myScore}점 · 다른 별을 누르면 내 점수만 수정됩니다.`
            : '별을 눌러 1~5점으로 평가해주세요.';
    }

    async function startRatingListener(albumId) {
        stopRatingListener();
        renderRatingPanel([]);
        setRatingButtonsDisabled(true);

        const summary = document.getElementById('rating-summary');
        const myStatus = document.getElementById('my-rating-status');
        if (summary) summary.textContent = '별점을 불러오는 중...';
        if (myStatus) myStatus.textContent = 'Firebase 연결을 확인하는 중입니다.';

        try {
            const service = await window.firebaseAlbumServicePromise;
            currentUserId = service.currentUserId;
            setRatingButtonsDisabled(false);

            ratingUnsubscribe = service.listenRatings(
                albumId,
                (ratings) => {
                    if (currentDetailAlbumId !== albumId) return;
                    currentRatings = ratings;
                    renderRatingPanel(ratings);
                },
                (error) => {
                    console.error('별점 실시간 불러오기 실패:', error);
                    if (summary) summary.textContent = '별점을 불러오지 못했습니다.';
                    if (myStatus) myStatus.textContent = 'Firestore 별점 권한 규칙을 확인해주세요.';
                    setRatingButtonsDisabled(true);
                }
            );
        } catch (error) {
            console.error('별점 연결 실패:', error);
            if (summary) summary.textContent = '별점 연결에 실패했습니다.';
            if (myStatus) myStatus.textContent = '잠시 후 새로고침해주세요.';
            setRatingButtonsDisabled(true);
        }
    }

    async function submitRating(score) {
        if (!currentDetailAlbumId || ratingSubmitting) return;
        if (!Number.isInteger(score) || score < 1 || score > 5) return;

        ratingSubmitting = true;
        setRatingButtonsDisabled(true);
        const myStatus = document.getElementById('my-rating-status');
        if (myStatus) myStatus.textContent = `${score}점을 저장하는 중...`;

        try {
            const service = await window.firebaseAlbumServicePromise;
            currentUserId = service.currentUserId;
            await service.saveRating(currentDetailAlbumId, score);
            // 저장 직후 onSnapshot이 다시 실행되어 평균과 내 별점이 자동 갱신됩니다.
        } catch (error) {
            console.error('별점 저장 실패:', error);
            showAlert(
                '별점 저장 실패',
                `${error.message || '별점을 저장하지 못했습니다.'}<br>Firestore 별점 규칙을 확인해주세요.`,
                'error'
            );
            renderRatingPanel(currentRatings);
        } finally {
            ratingSubmitting = false;
            if (currentDetailAlbumId) setRatingButtonsDisabled(false);
        }
    }

    function isOwnedAlbum(album) {
        return Boolean(album && currentUserId && album.createdBy === currentUserId);
    }

    function showAlbumDetail(id) {
        const album = albumsData.find(a => a.id === id);
        if (!album) return;
        currentDetailAlbumId = id;

        // 정보 채우기
        const coverImg = document.getElementById('detail-cover');
        coverImg.src = safeImageUrl(album.coverUrl);
        coverImg.onerror = function() { this.src='https://placehold.co/600x600/1db954/ffffff?text=No+Cover'; };
        
        document.getElementById('detail-title').textContent = album.title;
        document.getElementById('detail-artist').textContent = album.artist + ` (${album.classNum})`;
        
        // 상세 화면에 앨범 소개 텍스트 반영
        document.getElementById('detail-description').textContent = album.description || '앨범 소개가 없습니다.';
        
        document.getElementById('detail-lyricist').textContent = album.credits.lyricist || '정보 없음';
        document.getElementById('detail-composer').textContent = album.credits.composer || '정보 없음';
        document.getElementById('detail-producer').textContent = album.credits.producer || '정보 없음';

        // 익명 로그인 UID가 등록 당시 createdBy와 같은 경우에만 수정/삭제 버튼 표시
        const ownerActions = document.getElementById('detail-owner-actions');
        const editButton = document.getElementById('detail-edit-button');
        const deleteButton = document.getElementById('detail-delete-button');
        if (isOwnedAlbum(album)) {
            ownerActions.classList.remove('hidden');
            ownerActions.classList.add('flex');
            editButton.onclick = () => showEditModal(album.id);
            deleteButton.onclick = () => deleteAlbum(album.id);
        } else {
            ownerActions.classList.add('hidden');
            ownerActions.classList.remove('flex');
            editButton.onclick = null;
            deleteButton.onclick = null;
        }

        // 트랙 리스트 생성
        const trackList = document.getElementById('track-list');
        trackList.innerHTML = '';
        
        album.tracks.forEach((track, index) => {
            const trackEl = document.createElement('div');
            trackEl.className = 'group p-4 rounded-xl hover:bg-gray-800 transition-colors flex items-start gap-4 border border-transparent hover:border-gray-700';
            const trackLink = safeExternalUrl(track.link);
            
            trackEl.innerHTML = `
                <div class="text-gray-500 font-bold w-6 text-right pt-1 group-hover:text-spotify-base transition-colors">${index + 1}</div>
                <div class="flex-grow">
                    <h4 class="text-lg font-bold text-white mb-1 group-hover:text-spotify-base transition-colors">${escapeHtml(track.title)}</h4>
                    <p class="text-sm text-gray-400 mb-3">${escapeHtml(track.desc)}</p>
                    <a href="${escapeHtml(trackLink)}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-2 text-sm bg-gray-700 hover:bg-gray-600 text-white px-4 py-1.5 rounded-full transition-colors">
                        <i class="fas fa-external-link-alt text-xs"></i> Suno에서 듣기
                    </a>
                </div>
            `;
            trackList.appendChild(trackEl);
        });

        // 이 앨범의 별점을 실시간으로 구독한다.
        startRatingListener(album.id);

        // 화면 전환
        document.getElementById('class-filter-section').classList.add('hidden');
        document.getElementById('album-gallery').classList.add('hidden');
        document.getElementById('album-detail-view').classList.remove('hidden');
        window.scrollTo(0, 0);
    }

    async function deleteAlbum(id) {
        const album = albumsData.find(a => a.id === id);
        if (!album || !isOwnedAlbum(album)) {
            showAlert('삭제 불가', '본인이 등록한 앨범만 삭제할 수 있습니다.', 'error');
            return;
        }

        const confirmed = window.confirm(`“${album.title}” 앨범을 정말 삭제할까요?\n삭제한 데이터는 되돌릴 수 없습니다.`);
        if (!confirmed) return;

        try {
            const service = await window.firebaseAlbumServicePromise;
            await service.deleteAlbum(id);
            closeAlbumDetail();
            showAlert('삭제 완료', '앨범이 삭제되었습니다.', 'success');
        } catch (error) {
            console.error('앨범 삭제 실패:', error);
            showAlert('삭제 실패', `${error.message || '앨범을 삭제하지 못했습니다.'}<br>Firestore 규칙을 확인해주세요.`, 'error');
        }
    }

    async function handleRegistration(e) {
        e.preventDefault();

        const isEditing = Boolean(editingAlbumId);
        const targetAlbumId = editingAlbumId;
        const submitButton = e.submitter || e.target.querySelector('button[type="submit"]');
        if (submitButton) {
            submitButton.disabled = true;
            submitButton.innerHTML = `<i class="fas fa-circle-notch fa-spin mr-2"></i>${isEditing ? '수정 중...' : '등록 중...'}`;
        }

        try {
            const service = await window.firebaseAlbumServicePromise;
            const coverFile = document.getElementById('reg-cover').files[0];
            let coverUrl = editingOriginalCoverUrl;

            if (coverFile) {
                coverUrl = await compressCoverImage(coverFile);
            } else if (!isEditing) {
                throw new Error('앨범 자켓 이미지를 선택해주세요.');
            }

            const trackItems = document.querySelectorAll('#tracks-container .track-input-item');
            const tracks = [];

            trackItems.forEach((item, index) => {
                const titleInput = item.querySelector('.track-title');
                const linkInput = item.querySelector('.track-link');
                const descInput = item.querySelector('.track-desc');

                const title = titleInput ? titleInput.value.trim() : '';
                const link = linkInput ? linkInput.value.trim() : '';
                const desc = descInput ? descInput.value.trim() : '';

                if (index === 0 || title || link) {
                    tracks.push({
                        title: title || `Track ${index + 1}`,
                        link: link || '#',
                        desc: desc || ''
                    });
                }
            });

            const albumData = {
                id: isEditing
                    ? targetAlbumId
                    : ((window.crypto && crypto.randomUUID)
                        ? crypto.randomUUID()
                        : `album_${Date.now()}_${Math.random().toString(36).slice(2)}`),
                classNum: document.getElementById('reg-class').value,
                artist: document.getElementById('reg-artist').value.trim(),
                title: document.getElementById('reg-title').value.trim(),
                description: document.getElementById('reg-description').value.trim(),
                coverUrl: coverUrl,
                credits: {
                    lyricist: document.getElementById('reg-lyricist').value.trim(),
                    composer: document.getElementById('reg-composer').value.trim(),
                    producer: document.getElementById('reg-producer').value.trim()
                },
                tracks: tracks
            };

            if (isEditing) {
                await service.updateAlbum(albumData);
                closeRegistrationModal();
                showAlert('수정 완료!', '앨범 정보가 수정되었습니다.', 'success');
            } else {
                await service.saveAlbum(albumData);
                closeRegistrationModal();
                showAlert('등록 완료!', '앨범이 공동 전시관에 저장되었습니다.<br>다른 기기에도 바로 표시됩니다.', 'success');
            }
        } catch (error) {
            console.error(isEditing ? '앨범 수정 실패:' : '앨범 등록 실패:', error);
            showAlert(
                isEditing ? '수정 실패' : '등록 실패',
                `${error.message || '데이터베이스에 저장하지 못했습니다.'}<br>잠시 후 다시 시도해주세요.`,
                'error'
            );
        } finally {
            if (submitButton) {
                submitButton.disabled = false;
                submitButton.textContent = isEditing ? '수정 저장' : '앨범 등록하기';
            }
        }
    }

    function showAlert(title, message, type = 'info') {
        const modal = document.getElementById('alert-modal');
        const content = document.getElementById('alert-content');
        const titleEl = document.getElementById('alert-title');
        const messageEl = document.getElementById('alert-message');
        const iconEl = document.getElementById('alert-icon');

        titleEl.textContent = title;
        messageEl.innerHTML = message;

        // 아이콘 색상 설정
        iconEl.className = 'fas mb-4 text-5xl ';
        if (type === 'success') {
            iconEl.classList.add('fa-check-circle', 'text-spotify-base');
        } else if (type === 'error') {
            iconEl.classList.add('fa-exclamation-circle', 'text-red-500');
        } else {
            iconEl.classList.add('fa-info-circle', 'text-blue-500');
        }

        modal.classList.remove('hidden');
        // 애니메이션 효과
        setTimeout(() => {
            content.classList.remove('scale-95');
            content.classList.add('scale-100');
        }, 10);
    }

    function closeAlert() {
        const modal = document.getElementById('alert-modal');
        const content = document.getElementById('alert-content');
        
        content.classList.remove('scale-100');
        content.classList.add('scale-95');
        
        setTimeout(() => {
            modal.classList.add('hidden');
        }, 150);
    }
</script>


<!-- Firebase 초기화 -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
    import {
        getFirestore,
        collection,
        doc,
        setDoc,
        deleteDoc,
        onSnapshot,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyD7Tt80ur9TPDsINSOuX4ACKXUMpTjNaE4",
        authDomain: "streaming-f81ae.firebaseapp.com",
        projectId: "streaming-f81ae",
        storageBucket: "streaming-f81ae.firebasestorage.app",
        messagingSenderId: "501253045129",
        appId: "1:501253045129:web:7ae623ebaa757b21b8bf58"
    };

    window.firebaseAlbumServicePromise = (async () => {
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const credential = await signInAnonymously(auth);
        const albumsCollection = collection(
            db,
            'artifacts',
            'music-album-gallery',
            'public',
            'data',
            'albums'
        );

        return {
            currentUserId: credential.user.uid,

            saveAlbum: async (album) => {
                await setDoc(doc(albumsCollection, String(album.id)), {
                    ...album,
                    createdAt: serverTimestamp(),
                    createdBy: credential.user.uid
                });
            },

            updateAlbum: async (album) => {
                await setDoc(
                    doc(albumsCollection, String(album.id)),
                    {
                        ...album,
                        updatedAt: serverTimestamp()
                    },
                    { merge: true }
                );
            },

            deleteAlbum: async (albumId) => {
                await deleteDoc(doc(albumsCollection, String(albumId)));
            },

            saveRating: async (albumId, score) => {
                const numericScore = Number(score);
                if (!Number.isInteger(numericScore) || numericScore < 1 || numericScore > 5) {
                    throw new Error('별점은 1점부터 5점까지만 입력할 수 있습니다.');
                }

                const ratingsCollection = collection(
                    doc(albumsCollection, String(albumId)),
                    'ratings'
                );
                const ratingDoc = doc(ratingsCollection, credential.user.uid);

                // 문서 ID를 익명 로그인 UID로 사용하므로 한 사용자당 한 개의 별점만 존재합니다.
                // 다시 평가하면 같은 문서를 덮어써서 중복 집계되지 않습니다.
                await setDoc(
                    ratingDoc,
                    {
                        albumId: String(albumId),
                        userId: credential.user.uid,
                        score: numericScore,
                        updatedAt: serverTimestamp()
                    },
                    { merge: true }
                );
            },

            listenRatings: (albumId, onData, onError) => {
                const ratingsCollection = collection(
                    doc(albumsCollection, String(albumId)),
                    'ratings'
                );

                return onSnapshot(
                    ratingsCollection,
                    (snapshot) => {
                        const ratings = snapshot.docs.map((ratingDoc) => ({
                            id: ratingDoc.id,
                            ...ratingDoc.data()
                        }));
                        onData(ratings);
                    },
                    onError
                );
            },

            listenAlbums: (onData, onError) => {
                return onSnapshot(
                    albumsCollection,
                    (snapshot) => {
                        const albums = snapshot.docs
                            .map((albumDoc) => {
                                const data = albumDoc.data();
                                return {
                                    ...data,
                                    id: albumDoc.id,
                                    createdAtMillis: data.createdAt?.toMillis?.() || 0
                                };
                            })
                            .sort((a, b) => b.createdAtMillis - a.createdAtMillis);
                        onData(albums);
                    },
                    onError
                );
            }
        };
    })();
</script>
